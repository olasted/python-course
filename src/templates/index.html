<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Course</title>
    <script>
        (function () {
            var theme = 'light';
            try {
                var forced = new URLSearchParams(location.search).get('theme');
                if (forced === 'light' || forced === 'dark') localStorage.setItem('py-course-theme', forced);
                theme = localStorage.getItem('py-course-theme')
                    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.min.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <img src="/img/py_logo.png" alt="" class="logo">
            <div class="day-nav">
                <button id="prevDayBtn" class="icon-btn" title="Previous day" aria-label="Previous day">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
                </button>
                <select id="daySelect" aria-label="Choose a day"></select>
                <button id="nextDayBtn" class="icon-btn" title="Next day" aria-label="Next day">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>
                </button>
            </div>
        </div>

        <div class="topbar-right">
            <div class="progress" id="progressWrap" title="Tasks finished across the whole course">
                <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
                <span class="progress-text" id="progressText">0%</span>
            </div>
            <span class="streak" id="streakBadge" hidden title="Days in a row with at least one task finished"><span id="streakCount">0</span>-day streak</span>
            <button id="overviewBtn" class="text-btn">Overview</button>
            <button id="referenceBtn" class="text-btn">Reference</button>
            <button id="resetBtn" class="text-btn text-btn-danger" title="Reset all progress and start the course over">Reset</button>
            <button id="themeBtn" class="icon-btn" title="Switch between light and dark" aria-label="Switch theme">
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.6A5.5 5.5 0 0 1 6.4 2.5a5.5 5.5 0 1 0 7.1 7.1Z"/></svg>
            </button>
            <button id="menuBtn" class="icon-btn" title="More" aria-label="More options" aria-haspopup="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
            </button>
        </div>
    </header>

    <main id="mainLayout">
        <aside class="side" id="sidePanel">
            <div class="side-tabs" role="tablist">
                <button class="side-tab is-active" data-tab="lesson" role="tab" aria-selected="true">Lesson</button>
                <button class="side-tab" data-tab="tasks" role="tab" aria-selected="false">Tasks <span class="tab-count" id="taskCount"></span></button>
            </div>
            <div class="side-scroll" id="sideScroll">
                <section id="lessonView" class="lesson"></section>
                <section id="tasksView" class="tasks" hidden></section>
            </div>
        </aside>

        <div class="divider divider-v" id="leftDivider" title="Drag to resize"></div>

        <section class="work" id="workPanel">
            <div class="work-toolbar">
                <div class="work-title">
                    <span class="work-label">Editor</span>
                    <span class="work-target" id="workTarget"></span>
                </div>
                <div class="work-actions">
                    <button id="clearBtn" class="btn btn-quiet">Clear</button>
                    <button id="runBtn" class="btn btn-primary">Run <kbd>Ctrl&#8239;&#9166;</kbd></button>
                </div>
            </div>

            <div class="editor-area" id="editorArea">
                <div id="monacoEditor" class="editor-host"></div>
            </div>

            <div class="divider divider-h" id="bottomDivider" title="Drag to resize"></div>

            <div class="output" id="outputPanel">
                <div class="output-head">
                    <span class="output-label">Output</span>
                    <span class="output-status" id="outputStatus"></span>
                </div>
                <div class="output-body" id="outputBody">
                    <p class="output-empty">Run your code and the output will show up here.</p>
                </div>
            </div>
        </section>
    </main>

    <div class="menu" id="menuPanel" hidden>
        <button class="menu-item" id="menuHotkeys">Bracket shortcuts</button>
        <button class="menu-item" id="menuFocus">Focus mode <span class="menu-note" id="focusState">off</span></button>
    </div>

    <div class="popover" id="hotkeyPanel" hidden></div>

    <div class="overlay" id="overviewOverlay" hidden>
        <div class="dialog dialog-wide" role="dialog" aria-labelledby="overviewTitle">
            <div class="dialog-head">
                <h2 id="overviewTitle">The whole course</h2>
                <button class="icon-btn" data-close aria-label="Close">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
                </button>
            </div>
            <p class="dialog-sub" id="overviewSummary"></p>
            <div class="overview-list" id="overviewList"></div>
        </div>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="referenceDrawer" hidden aria-label="Quick reference">
        <div class="drawer-head">
            <h2>Quick reference</h2>
            <button class="icon-btn" data-close aria-label="Close">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
            </button>
        </div>
        <input type="search" id="referenceSearch" class="drawer-search" placeholder="Search, e.g. split or range" autocomplete="off">
        <div class="drawer-body" id="referenceBody"></div>
    </aside>

    <div class="toast" id="toast" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
